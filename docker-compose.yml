services:
  api:
    build: .
    container_name: bookstore-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      DB_PATH: "/app/data/bookstore.db"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
    volumes:
      - db-data:/app/data
    restart: unless-stopped

volumes:
  db-data: